name: Deploy

# Build -> e2e-gate (against the built image) -> deploy to prod. The image is
# env-agnostic (runtime SITE_FQDN), built once and shipped as-is; the production
# environment supplies its own SSH host/key + SITE_FQDN. Hardened: runs only on
# push to master / manual dispatch (never fork PRs); deploy is gated on the
# protected Environment AND the DEPLOY_ENABLED repo variable.
on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: deploy-landing
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/agentage/landing/site

jobs:
  build:
    name: 🏗️ Build image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: docker/login-action@v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v4
      - id: vars
        run: echo "build_time=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v7
        with:
          context: .
          target: runner
          push: true
          # Env-agnostic image (runtime SITE_FQDN), so neutral tags.
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
          build-args: |
            COMMIT_SHA=${{ github.sha }}
            BUILD_TIME=${{ steps.vars.outputs.build_time }}
          cache-from: type=gha,scope=landing
          cache-to: type=gha,mode=max,scope=landing

  e2e-gate:
    name: 🎭 E2E gate (built image)
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - if: steps.pw-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
      - uses: docker/login-action@v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Run the built image with no SITE_FQDN - it must default to the prod apex
      # (agentage.io). Validates the exact artifact AND that an unconfigured
      # container serves prod, which is what ships.
      - name: Start image
        run: |
          docker run -d --name landing -p 3100:3000 "${IMAGE}:${GITHUB_SHA}"
          for i in $(seq 1 30); do
            [ "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3100/)" = "200" ] && break
            sleep 1
          done
          curl -fsS -o /dev/null http://localhost:3100/ || { docker logs landing; exit 1; }
      - name: E2E vs image
        env:
          LANDING_BASE_URL: http://localhost:3100
          LANDING_EXPECTED_HOST: agentage.io
        run: npm run test:e2e
      - name: Upload report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-gate-report
          path: |
            playwright-report/
            packages/*/test-results/
          retention-days: 7

  deploy:
    name: 🚀 Deploy (production)
    needs: e2e-gate
    if: vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-ssh
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}
          host: ${{ secrets.SSH_HOST }}
      - name: Render compose
        env:
          SITE_FQDN: ${{ vars.SITE_FQDN }}
          IMAGE_TAG: ${{ github.sha }}
          GA_MEASUREMENT_ID: ${{ vars.GA_MEASUREMENT_ID }}
          # SigNoz OTLP over the mesh; empty token keeps tracing inert.
          OTEL_EXPORTER_OTLP_ENDPOINT: ${{ vars.OTEL_EXPORTER_OTLP_ENDPOINT || 'http://172.31.0.1:4318' }}
          SIGNOZ_INGEST_TOKEN: ${{ secrets.SIGNOZ_INGEST_TOKEN }}
        run: |
          envsubst '${SITE_FQDN} ${IMAGE_TAG} ${GA_MEASUREMENT_ID} ${OTEL_EXPORTER_OTLP_ENDPOINT} ${SIGNOZ_INGEST_TOKEN}' < docker-compose.yml > docker-compose.deploy.yml
          if grep -E '\$\{(SITE_FQDN|IMAGE_TAG|GA_MEASUREMENT_ID)' docker-compose.deploy.yml; then
            echo "::error::unresolved variable in docker-compose.deploy.yml"; exit 1
          fi
      - name: Copy compose to host
        run: |
          ssh ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} "mkdir -p /opt/agentage/landing"
          scp docker-compose.deploy.yml ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/opt/agentage/landing/docker-compose.yml
      - name: Login to GHCR on host
        run: echo "${{ secrets.GITHUB_TOKEN }}" | ssh ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} "docker login ghcr.io -u ${{ github.actor }} --password-stdin"
      - name: Deploy stack
        run: ssh ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} "cd /opt/agentage/landing && docker stack deploy -c docker-compose.yml agentage-landing --with-registry-auth"
      - name: Wait + live smoke
        env:
          SITE_FQDN: ${{ vars.SITE_FQDN }}
        run: |
          # Assert /health serves THIS commit - a hero-text grep passes against the
          # OLD container (2026-08-06: green runs left prod stale, prune raced the
          # rolling update). Convergence-gating here also keeps the prune step safe.
          for i in $(seq 1 60); do
            commit=$(curl -fsS "https://${SITE_FQDN}/health" 2>/dev/null | grep -o '"commit":"[^"]*"' | cut -d'"' -f4)
            [ "$commit" = "${{ github.sha }}" ] && { ok=1; break; }
            sleep 5
          done
          echo "Smoke: https://${SITE_FQDN}/health -> ${commit:-none}"
          [ -n "${ok:-}" ] || { echo "::error::${SITE_FQDN} never served commit ${{ github.sha }} (last: ${commit:-none})"; exit 1; }
          curl -fsS "https://${SITE_FQDN}/" | grep -q "One memory" || { echo "::error::apex hero missing"; exit 1; }
          robots=$(curl -fsS "https://${SITE_FQDN}/robots.txt")
          echo "$robots" | grep -qi "Sitemap:" || { echo "::error::prod robots missing Sitemap"; exit 1; }
          echo "$robots" | grep -qiE '^[[:space:]]*Disallow:[[:space:]]*/[[:space:]]*$' && { echo "::error::prod robots blanket-disallow"; exit 1; }
          echo "✅ prod serving + indexable"

      - name: Reclaim disk (post-deploy)
        # system prune also clears stopped Swarm task containers (2026-07-31 disk-full incident).
        run: |
          # Best-effort: concurrent stack deploys race the docker prune lock; never fail a deploy on cleanup.
          ssh ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} "docker system prune -af" && exit 0
          sleep 45
          ssh ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} "docker system prune -af" || echo "::warning::post-deploy prune skipped (another prune in progress)"
